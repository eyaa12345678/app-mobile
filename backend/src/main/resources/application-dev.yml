spring:
  datasource:
    url: jdbc:h2:mem:medicare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect


app:
  jwt:
    secret: ${JWT_SECRET:local-development-only-medicare-secret-at-least-32-bytes}
