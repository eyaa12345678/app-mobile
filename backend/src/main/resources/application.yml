server:
  port: 8080

spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp:
        auth: ${MAIL_SMTP_AUTH:true}
        starttls.enable: ${MAIL_STARTTLS:true}
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
  datasource:
    url: jdbc:postgresql://localhost:5432/medicare
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  security:
    compromised-password-check: ${PASSWORD_COMPROMISE_CHECK_ENABLED:true}
    password-history-size: ${PASSWORD_HISTORY_SIZE:5}
    rate-limit-enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
